name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bundle secret check (no API token in browser bundle)
        run: npm run check:secrets

  dependency-audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Python dependency audit
        run: uvx pip-audit || true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  docker-compose:
    name: Docker Compose (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then
              echo "backend healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          docker compose logs backend
          exit 1
      - name: API connectivity smoke test
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/api/v1/version
          curl -fsS http://localhost:8000/api/v1/security/status
      - name: Frontend reachable
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5173/ >/dev/null; then
              echo "frontend reachable"
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not become reachable"
          docker compose logs frontend
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
